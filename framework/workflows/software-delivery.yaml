id: software-delivery
name: Software Delivery Workflow
schemaVersion: midas.workflow.v2
status: alpha
purpose: Move one scoped software objective from context to implementation evidence.
steps:
  - id: context
    name: Load project context
    output: confirmed objective and constraints
    agent: planner
    model-tier: frontier
    handoff:
      after: []
      enables: [planning]
  - id: planning
    name: Create local planning packet
    output: PRD.md, DESIGN.md, EXPERIENCE.md, and local planning handoff
    agent: planner
    model-tier: frontier
    handoff:
      after: [context]
      enables: [work-order]
  - id: work-order
    name: Create or select work order
    output: scoped work order
    agent: planner
    model-tier: frontier
    handoff:
      after: [planning]
      enables: [design]
  - id: design
    name: Align UX spine and acceptance criteria
    output: mapped DESIGN.md and EXPERIENCE.md plus exact output and format constraints
    agent: frontend-developer
    model-tier: frontier
    handoff:
      after: [work-order]
      enables: [implementation-readiness]
  - id: implementation-readiness
    name: Check implementation readiness
    output: readiness verdict with named owners for concerns or a blocking failure
    agent: reviewer
    model-tier: frontier
    handoff:
      after: [design]
      enables: [implementation]
    gate:
      type: readiness
      verdicts: [PASS, CONCERNS, FAIL]
      concernsRequire: owners
      failBlocks: true
  - id: implementation
    name: Implement the smallest complete slice
    output: code or documentation changes
    agent: builder
    model-tier: frontier
    handoff:
      after: [implementation-readiness]
      enables: [verification-gap]
  - id: verification-gap
    name: Compare requirements against implementation evidence
    output: verification-gap receipt with gaps or traceability proof
    agent: reviewer
    model-tier: frontier
    handoff:
      after: [implementation]
      enables: [verification]
  - id: verification
    name: Verify the slice
    output: test/build/manual evidence
    agent: test-automator
    model-tier: frontier
    handoff:
      after: [verification-gap]
      enables: [docs-staleness]
  - id: docs-staleness
    name: Check source-to-docs drift
    output: docs-staleness pass or required documentation follow-up
    agent: docs-engineer
    model-tier: frontier
    handoff:
      after: [verification]
      enables: [closeout]
  - id: closeout
    name: Record evidence and next action
    output: run ledger entry
    agent: reviewer
    model-tier: frontier
    handoff:
      after: [docs-staleness]
      enables: []
rules:
  - one active objective
  - local planning before broad implementation
  - design components map to experience flows before UI build claims
  - readiness gate before implementation - PASS proceeds, CONCERNS requires named owners, FAIL blocks
  - verification-gap receipt before completion claims
  - exact task instructions override generic process guidance
  - evidence before claims
  - approval required for destructive, external, money-moving, or production actions
  - generated files are not source of truth
