[project]
name = "midas"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "mds-common",
    "midas-core",
    "forge",
    "shield",
    "pulse",
    "click>=8.1",
]

[project.scripts]
midas = "studios.dev_studio.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["studios"]

[tool.uv.workspace]
members = [
    "packages/*",
]

[tool.uv.sources]
mds-common = { workspace = true }
midas-core = { workspace = true }
forge = { workspace = true }
shield = { workspace = true }
pulse = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "mypy>=1.8",
    "ruff>=0.3",
    "types-pyyaml>=6.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TCH"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["litellm.*", "asyncpg.*", "pgvector.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
