[project]
name = "midas-core"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "mds-common",
    "litellm>=1.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/midas_core"]

[tool.uv.sources]
mds-common = { workspace = true }
