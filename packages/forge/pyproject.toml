[project]
name = "forge"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "mds-common",
    "midas-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forge"]

[tool.uv.sources]
mds-common = { workspace = true }
midas-core = { workspace = true }
