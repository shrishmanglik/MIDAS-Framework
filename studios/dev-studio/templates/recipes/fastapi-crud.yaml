name: fastapi-crud
description: "Generate a complete FastAPI CRUD resource: model, schema, service, router, config, Dockerfile, and docker-compose"
studio: dev-studio
version: "1.0"
templates:
  - id: fastapi-main
    path: fastapi/main.py.j2
    output: "app/main.py"
    description: "FastAPI application entrypoint with middleware, CORS, and router includes"

  - id: fastapi-router
    path: fastapi/router.py.j2
    output: "app/api/v1/routes/{{ entity | snake_case }}.py"
    description: "Resource router with CRUD endpoints, auth, and pagination"

  - id: fastapi-model
    path: fastapi/model.py.j2
    output: "app/models/{{ entity | snake_case }}.py"
    description: "SQLAlchemy model with UUID primary key, timestamps, and relationships"

  - id: fastapi-schema
    path: fastapi/schema.py.j2
    output: "app/schemas/{{ entity | snake_case }}.py"
    description: "Pydantic request/response schemas with field validation"

  - id: fastapi-crud
    path: fastapi/crud.py.j2
    output: "app/services/{{ entity | snake_case }}_service.py"
    description: "Service class with CRUD operations, pagination, and ownership checks"

  - id: fastapi-config
    path: fastapi/config.py.j2
    output: "app/core/config.py"
    description: "Pydantic BaseSettings configuration loading from environment variables"

  - id: docker-dockerfile
    path: docker/Dockerfile.j2
    output: "Dockerfile"
    description: "Multi-stage Dockerfile with security best practices for Python/FastAPI"

  - id: docker-compose
    path: docker/docker-compose.yml.j2
    output: "docker-compose.yml"
    description: "docker-compose stack with backend, database, and optional cache service"

required_vars:
  - project_name
  - description
  - entity
  - entity_plural
  - fields
  - python_version
  - app_port
  - backend_port
  - db_name
  - cors_origins

optional_vars:
  - api_prefix
  - debug
  - auth_required
  - include_search
  - relationships
  - table_args
  - validators
  - owner_field
  - custom_methods
  - extra_settings
  - package_manager
  - extra_system_deps
  - include_redis
  - include_frontend
  - frontend_port
  - redis_port

example_vars:
  project_name: "Job Board Platform"
  description: "A web-based job board where companies post listings and candidates apply"
  entity: "job"
  entity_plural: "jobs"
  python_version: "3.11"
  app_port: 8000
  backend_port: 8000
  db_name: "jobboard"
  cors_origins: '["http://localhost:3000"]'
  fields:
    - name: title
      type: string
      python_type: str
      max_length: 200
      min_length: 3
      description: "Job posting title"
      example: '"Senior Python Developer"'
    - name: description
      type: string
      python_type: str
      max_length: 10000
      min_length: 10
      description: "Detailed job description"
    - name: location
      type: string
      python_type: str
      max_length: 100
      min_length: 2
      description: "Job location"
      example: '"Austin, TX"'
    - name: salary_min
      type: integer
      python_type: int
      ge: 0
      description: "Minimum salary"
      example: 80000
    - name: salary_max
      type: integer
      python_type: int
      ge: 0
      description: "Maximum salary"
      example: 150000
    - name: employer_id
      type: fk
      python_type: UUID
      references: users
      on_delete: CASCADE
      read_only: true
      description: "ID of the employer who posted this job"
