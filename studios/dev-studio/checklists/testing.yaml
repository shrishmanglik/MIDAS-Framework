name: testing
gates:
  - name: acceptance-criteria-tested
    description: "Every acceptance criterion has at least one corresponding test"
    severity: critical

  - name: auth-endpoints-tested
    description: "All endpoints tested for authentication (401 for missing token, 403 for wrong role)"
    severity: critical

  - name: injection-tested
    description: "All user inputs tested for SQL injection and XSS"
    severity: critical

  - name: critical-findings-block
    description: "All CRITICAL findings block deployment -- no exceptions"
    severity: critical

  - name: boundary-values-tested
    description: "Boundary values tested (empty, null, max length, negative numbers)"
    severity: warning

  - name: error-responses-verified
    description: "Error responses verified for correct HTTP status codes and format"
    severity: warning

  - name: n-plus-one-checked
    description: "N+1 query patterns checked in all list endpoints"
    severity: warning

  - name: coverage-thresholds-met
    description: "Test coverage meets minimum thresholds (80% backend, 70% frontend)"
    severity: warning

  - name: minimum-findings
    description: "Minimum 3 findings in code review (or explicit justification for fewer)"
    severity: info

  - name: findings-include-details
    description: "Every finding includes: file, line, severity, issue description, and fix recommendation"
    severity: info
