name: implementation
gates:
  - name: endpoints-match-spec
    description: "All endpoints match the architecture specification exactly (paths, methods, status codes)"
    severity: critical

  - name: input-validation-present
    description: "Every endpoint has Pydantic input validation -- no raw dict access"
    severity: critical

  - name: auth-on-mutations
    description: "Every endpoint that modifies data requires authentication"
    severity: critical

  - name: no-hardcoded-secrets
    description: "No hardcoded secrets, API keys, or database credentials in source code"
    severity: critical

  - name: parameterized-queries
    description: "All SQL queries use parameterized statements via ORM -- zero raw string concatenation"
    severity: critical

  - name: error-response-format
    description: "Error responses use the standardized format: { 'detail': str, 'code': str }"
    severity: warning

  - name: pagination-implemented
    description: "List endpoints implement pagination with skip/limit and return total count"
    severity: warning

  - name: service-layer-separation
    description: "Service layer is separated from route handlers -- routes are thin"
    severity: warning

  - name: health-check-exists
    description: "Health check endpoint exists at GET /health returning { 'status': 'ok' }"
    severity: warning

  - name: session-management
    description: "All async database operations use proper session management (no leaked sessions)"
    severity: info

  - name: typescript-no-any
    description: "All TypeScript types match the API contracts exactly -- no 'any' types"
    severity: warning

  - name: accessibility-compliance
    description: "All interactive elements are keyboard-accessible with visible focus indicators (WCAG 2.1 AA)"
    severity: warning
